<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>fleur 3D</title>
	<link rel="stylesheet" href="../styles.css">
	<!-- <link rel="stylesheet" href="../sketch.css"> -->
	<style>
		body{
			background-color: #68821B;
			display: flex;
			flex-wrap: wrap;
		}
		.valueDisplay, .Slider {
			flex: 0 0 35%;
			margin: 5px 0;
		}
		.valueDisplay{
			color: white;
			font-weight: 500;
		}
		.Slider {
			-webkit-appearance: none;
			appearance: none; 
			cursor: pointer;
			outline: none;
			border-radius: 15px;
			height: 20px;
			height: 6px;
			background: #ccc;
		}
		.Slider::-webkit-slider-thumb {
			-webkit-appearance: none;
			appearance: none; 
			height: 15px;
			width: 15px;
			background: rgb(255, 98, 127);
			border-radius: 50%;
			transition: .2s ease-in-out;
		}
	</style>
</head>
<body>
	<!-- <div id="projectNav"><a href="../index.html">Home</a></div> -->
	<script src="../js/p5.js"></script>
	<script src="../js/fleur-code.js"></script>
</body>
</html>
